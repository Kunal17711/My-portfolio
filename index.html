<body>

<div id="television">

    <main id="screen" class="kb-intro-running">

        <div class="grid"></div>

        <div id="viewport">
            <div id="world"></div>
        </div>

        <div class="crt-glass"></div>
        <div class="scanlines"></div>
        <div class="scan-beam"></div>
        <div class="vignette"></div>
        <div id="glitch"></div>

        <header class="header">

            <button id="about" class="about-button" title="About Kunal Builds" aria-label="About">
                ?
            </button>

            <div class="branding">
                <h1>KUNAL<span>BUILDS</span></h1>
                <p>INDEPENDENT DIGITAL LAB</p>
            </div>

            <div class="signal">
                <div class="live">
                    <i></i> LIVE
                </div>
                <span id="channel">CH 01</span>
                <span id="clock">00:00:00</span>
            </div>

        </header>

        <div class="side-label">
            DIGITAL EXPERIENCE / VOL. 03
        </div>

        <div id="projectLabel">
            <span id="activeCategory">SOCIAL PLATFORM</span>
            <strong id="activeName">ORBIT</strong>
        </div>

        <div class="navigation">

            <div class="instructions">
                DRAG TO EXPLORE
                <b>/</b>
                SCROLL TO ZOOM
            </div>

            <div class="controls">

                <button id="prev" title="Previous project" aria-label="Previous project">
                    &#8592;
                </button>

                <button id="reset" title="Reset view">
                    PROJECTS
                </button>

                <button id="next" title="Next project" aria-label="Next project">
                    &#8594;
                </button>

                <div class="separator"></div>

                <button id="music" title="Toggle music">
                    MUSIC OFF
                </button>

                <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">
                    &#9974;
                </button>

                <button id="power" title="Power" aria-label="Power">
                    &#9211;
                </button>

            </div>

            <div id="musicPanel">

                <span>VOLUME</span>

                <input type="range"
                    id="volume"
                    min="0"
                    max="100"
                    value="30"
                    aria-label="Music volume">

                <span id="volumeValue">30%</span>

            </div>

        </div>

        <button id="contact" class="contact-sticker">
            <strong>LET'S<br>BUILD</strong>
            <span>GET IN TOUCH &#8599;</span>
        </button>

        <div class="bottom-info">
            SYSTEM ONLINE / V.03
        </div>

        <div id="standby">
            <p>NO SIGNAL</p>
            <button id="wake">POWER ON</button>
        </div>

        <div id="boot">
            <div class="boot-content">
                <div class="boot-logo">K</div>
                <h2>KUNAL BUILDS</h2>
                <p>INITIALIZING DIGITAL EXPERIENCE</p>
                <div class="loading-track">
                    <div class="loading-bar"></div>
                </div>
                <span>ESTABLISHING SIGNAL...</span>
            </div>
        </div>

    </main>

</div>

<dialog id="detail">

    <button id="close" aria-label="Close">&times;</button>

    <img id="detailImage" alt="Project preview">

    <div class="detail-content">

        <span id="detailCategory"></span>

        <h2 id="detailTitle"></h2>

        <p id="detailDescription"></p>

        <div id="detailTags"></div>

        <a id="detailLink"
           target="_blank"
           rel="noopener noreferrer">
           EXPLORE &#8599;
        </a>

    </div>

</dialog>

<audio id="audio" loop preload="none">
    <source src="assets/audio/portfolio-ambient.wav" type="audio/wav">
</audio>
